<svg width="350" height="350" viewBox="0 0 350 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Large Fire Element -->
  <g transform="translate(50, 50)">
    <path d="M50 15C50 15 30 45 30 75C30 105 40 120 50 120C60 120 70 105 70 75C70 45 50 15 50 15Z" 
          fill="#12487E" opacity="0.8"/>
    <path d="M50 40C50 40 40 50 40 60C40 70 45 75 50 75C55 75 60 70 60 60C60 50 50 40 50 40Z" 
          fill="#12487E" opacity="0.9"/>
    <circle cx="50" cy="55" r="8" fill="#12487E" opacity="0.7"/>
    <circle cx="45" cy="50" r="3" fill="#12487E" opacity="0.8"/>
    <circle cx="55" cy="60" r="2" fill="#12487E" opacity="0.6"/>
  </g>
  
  <!-- Large Water Element -->
  <g transform="translate(200, 80)">
    <path d="M40 10C40 10 20 40 20 70C20 100 30 115 40 115C50 115 60 100 60 70C60 40 40 10 40 10Z" 
          fill="#12487E" opacity="0.8"/>
    <circle cx="35" cy="35" r="8" fill="#12487E" opacity="0.9"/>
    <circle cx="45" cy="45" r="6" fill="#12487E" opacity="0.7"/>
    <path d="M30 60 Q40 50 50 60" fill="none" stroke="#12487E" stroke-width="3" opacity="0.8"/>
    <path d="M35 70 Q40 65 45 70" fill="none" stroke="#12487E" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Large Earth Element -->
  <g transform="translate(80, 200)">
    <rect x="20" y="20" width="60" height="60" rx="15" fill="#12487E" opacity="0.8"/>
    <circle cx="50" cy="50" r="20" fill="#12487E" opacity="0.9"/>
    <rect x="40" y="40" width="20" height="20" rx="5" fill="#12487E" opacity="0.7"/>
    <rect x="45" y="45" width="10" height="10" rx="2" fill="#12487E" opacity="0.8"/>
  </g>
  
  <!-- Large Air Element -->
  <g transform="translate(220, 220)">
    <circle cx="40" cy="40" r="35" fill="none" stroke="#12487E" stroke-width="4" opacity="0.8"/>
    <circle cx="40" cy="40" r="25" fill="none" stroke="#12487E" stroke-width="3" opacity="0.9"/>
    <circle cx="40" cy="40" r="15" fill="none" stroke="#12487E" stroke-width="2" opacity="0.7"/>
    <circle cx="40" cy="40" r="8" fill="#12487E" opacity="0.9"/>
    <path d="M20 20 L60 60 M60 20 L20 60" stroke="#12487E" stroke-width="2" opacity="0.6"/>
    <path d="M25 40 L55 40 M40 25 L40 55" stroke="#12487E" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Hero Character - Large -->
  <g transform="translate(150, 150)">
    <!-- Head -->
    <ellipse cx="30" cy="20" rx="18" ry="15" fill="#12487E" opacity="0.6"/>
    <!-- Body -->
    <rect x="18" y="30" width="24" height="30" rx="6" fill="#12487E" opacity="0.7"/>
    <!-- Arms -->
    <rect x="8" y="35" width="12" height="20" rx="3" fill="#12487E" opacity="0.5"/>
    <rect x="40" y="35" width="12" height="20" rx="3" fill="#12487E" opacity="0.5"/>
    <!-- Legs -->
    <rect x="22" y="55" width="8" height="20" rx="2" fill="#12487E" opacity="0.5"/>
    <rect x="30" y="55" width="8" height="20" rx="2" fill="#12487E" opacity="0.5"/>
    <!-- Weapon/Staff -->
    <rect x="52" y="5" width="4" height="40" rx="2" fill="#12487E" opacity="0.8"/>
    <circle cx="54" cy="3" r="6" fill="#12487E" opacity="0.9"/>
    <circle cx="54" cy="3" r="3" fill="#12487E" opacity="0.7"/>
  </g>
  
  <!-- Enemy/Boss - Large -->
  <g transform="translate(50, 250)">
    <ellipse cx="40" cy="25" rx="25" ry="20" fill="#12487E" opacity="0.5"/>
    <rect x="25" y="40" width="30" height="25" rx="8" fill="#12487E" opacity="0.6"/>
    <!-- Tentacles -->
    <path d="M30 60 Q20 75 25 85" fill="none" stroke="#12487E" stroke-width="4" opacity="0.7"/>
    <path d="M40 60 Q40 75 40 90" fill="none" stroke="#12487E" stroke-width="4" opacity="0.7"/>
    <path d="M50 60 Q60 75 55 85" fill="none" stroke="#12487E" stroke-width="4" opacity="0.7"/>
    <path d="M35 60 Q25 70 30 75" fill="none" stroke="#12487E" stroke-width="3" opacity="0.6"/>
    <path d="M45 60 Q55 70 50 75" fill="none" stroke="#12487E" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- Power Orbs - Large -->
  <g transform="translate(250, 50)">
    <circle cx="20" cy="20" r="15" fill="#12487E" opacity="0.6"/>
    <circle cx="20" cy="20" r="8" fill="#12487E" opacity="0.8"/>
    <circle cx="20" cy="20" r="3" fill="#12487E" opacity="0.9"/>
  </g>
  
  <g transform="translate(100, 120)">
    <circle cx="15" cy="15" r="12" fill="#12487E" opacity="0.6"/>
    <circle cx="15" cy="15" r="6" fill="#12487E" opacity="0.8"/>
    <circle cx="15" cy="15" r="2" fill="#12487E" opacity="0.9"/>
  </g>
  
  <!-- Energy Connections -->
  <path d="M100 100 Q175 175 250 100" fill="none" stroke="#12487E" stroke-width="2" opacity="0.3"/>
  <path d="M250 150 Q175 225 100 250" fill="none" stroke="#12487E" stroke-width="2" opacity="0.3"/>
  <path d="M100 100 L100 250" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.2"/>
  <path d="M250 100 L250 250" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.2"/>
</svg>
