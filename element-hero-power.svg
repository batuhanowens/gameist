<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="150" height="150" fill="transparent"/>
  
  <!-- Hero Character - Large -->
  <g transform="translate(75, 40)">
    <!-- Body glow -->
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#0A2E5A" opacity="0.2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-8" r="8" fill="#0A2E5A" opacity="0.5"/>
    <circle cx="0" cy="-8" r="5" fill="#0A2E5A" opacity="0.6"/>
    
    <!-- Body -->
    <rect x="-6" y="-2" width="12" height="14" rx="3" fill="#0A2E5A" opacity="0.5"/>
    
    <!-- Arms -->
    <rect x="-12" y="0" width="6" height="10" rx="2" fill="#0A2E5A" opacity="0.4"/>
    <rect x="6" y="0" width="6" height="10" rx="2" fill="#0A2E5A" opacity="0.4"/>
    
    <!-- Legs -->
    <rect x="-4" y="10" width="3" height="8" rx="1.5" fill="#0A2E5A" opacity="0.4"/>
    <rect x="1" y="10" width="3" height="8" rx="1.5" fill="#0A2E5A" opacity="0.4"/>
    
    <!-- Weapon/Staff -->
    <rect x="10" y="-18" width="2" height="25" rx="1" fill="#0A2E5A" opacity="0.6"/>
    <circle cx="11" cy="-18" r="3" fill="#0A2E5A" opacity="0.7"/>
    <circle cx="11" cy="-18" r="1.5" fill="#061A3A" opacity="0.9"/>
    
    <!-- Energy aura -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0A2E5A" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Power Orb - Large with Energy -->
  <g transform="translate(75, 110)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="18" fill="#0A2E5A" opacity="0.2"/>
    
    <!-- Main orb -->
    <circle cx="0" cy="0" r="12" fill="#0A2E5A" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="#0A2E5A" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#0A2E5A" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#061A3A" opacity="0.9"/>
    
    <!-- Energy rays -->
    <path d="M0,-12 L0,-8 M8.5,-8.5 L6,-6 M8.5,8.5 L6,6 M0,12 L0,8 M-8.5,8.5 L-6,6 M-8.5,-8.5 L-6,-6" 
          stroke="#0A2E5A" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Rotating energy rings -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#0A2E5A" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#0A2E5A" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
