<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fire Symbol -->
  <g transform="translate(10, 10)">
    <path d="M10 2C10 2 6 6 6 10C6 14 8 16 10 16C12 16 14 14 14 10C14 6 10 2 10 2Z" 
          fill="#12487E" opacity="0.6"/>
    <circle cx="10" cy="8" r="1.5" fill="#12487E" opacity="0.8"/>
  </g>
  
  <!-- Water Symbol -->
  <g transform="translate(70, 10)">
    <path d="M10 2C10 2 6 6 6 10C6 14 8 16 10 16C12 16 14 14 14 10C14 6 10 2 10 2Z" 
          fill="#12487E" opacity="0.6"/>
    <circle cx="8" cy="8" r="1.5" fill="#12487E" opacity="0.8"/>
    <circle cx="12" cy="10" r="1" fill="#12487E" opacity="0.6"/>
  </g>
  
  <!-- Earth Symbol -->
  <g transform="translate(10, 70)">
    <rect x="6" y="6" width="8" height="8" rx="2" fill="#12487E" opacity="0.6"/>
    <circle cx="10" cy="10" r="2" fill="#12487E" opacity="0.8"/>
  </g>
  
  <!-- Air Symbol -->
  <g transform="translate(70, 70)">
    <circle cx="10" cy="10" r="6" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.6"/>
    <circle cx="10" cy="10" r="3" fill="none" stroke="#12487E" stroke-width="1" opacity="0.8"/>
    <circle cx="10" cy="10" r="1" fill="#12487E" opacity="0.9"/>
  </g>
  
  <!-- Hero Figure -->
  <g transform="translate(40, 40)">
    <circle cx="5" cy="3" r="2.5" fill="#12487E" opacity="0.5"/>
    <rect x="3" y="5" width="4" height="6" rx="1" fill="#12487E" opacity="0.6"/>
    <rect x="1" y="6" width="1.5" height="4" rx="0.5" fill="#12487E" opacity="0.4"/>
    <rect x="6.5" y="6" width="1.5" height="4" rx="0.5" fill="#12487E" opacity="0.4"/>
  </g>
  
  <!-- Power Orbs -->
  <circle cx="25" cy="40" r="1.5" fill="#12487E" opacity="0.6"/>
  <circle cx="75" cy="40" r="1.5" fill="#12487E" opacity="0.6"/>
  <circle cx="50" cy="75" r="1.5" fill="#12487E" opacity="0.6"/>
</svg>
