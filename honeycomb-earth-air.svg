<svg width="120" height="104" viewBox="0 0 120 104" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="104" fill="transparent"/>
  
  <!-- Perfect Honeycomb Pattern - Two Hexagons Touching -->
  
  <!-- Left Hexagon with Earth Element -->
  <g>
    <path d="M30,5 L50,17 L50,37 L30,49 L10,37 L10,17 Z" 
          fill="none" stroke="#0A2E5A" stroke-width="3" opacity="0.7"/>
    <!-- Earth Element - Square -->
    <g transform="translate(30, 27)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#0A2E5A" opacity="0.5"/>
      <circle cx="0" cy="0" r="3" fill="#0A2E5A" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Right Hexagon with Air Element - Touching Left -->
  <g>
    <path d="M90,5 L110,17 L110,37 L90,49 L70,37 L70,17 Z" 
          fill="none" stroke="#0A2E5A" stroke-width="3" opacity="0.7"/>
    <!-- Air Element - Circles -->
    <g transform="translate(90, 27)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#0A2E5A" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#0A2E5A" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="0" r="1" fill="#0A2E5A" opacity="0.8"/>
      <path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#0A2E5A" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
</svg>
