<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="150" height="150" fill="transparent"/>
  
  <!-- Earth Element - Large Square with Core -->
  <g transform="translate(75, 40)">
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#0A2E5A" opacity="0.3"/>
    <rect x="-15" y="-15" width="30" height="30" rx="6" fill="#0A2E5A" opacity="0.5"/>
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#0A2E5A" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#0A2E5A" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#061A3A" opacity="0.9"/>
    
    <!-- Earth details -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#0A2E5A" stroke-width="1" opacity="0.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#0A2E5A" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0A2E5A" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Air Element - Large Circles with Lines -->
  <g transform="translate(75, 110)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#0A2E5A" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#0A2E5A" stroke-width="2.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#0A2E5A" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#0A2E5A" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#061A3A" opacity="0.9"/>
    
    <!-- Air flow lines -->
    <path d="M-14,-14 L14,14 M14,-14 L-14,14" stroke="#0A2E5A" stroke-width="1.5" opacity="0.4"/>
    <path d="M-10,0 L10,0 M0,-10 L0,10" stroke="#0A2E5A" stroke-width="1" opacity="0.5"/>
    
    <!-- Wind swirls -->
    <path d="M-8,-8 Q-4,-12 0,-8 Q4,-4 8,-8" fill="none" stroke="#0A2E5A" stroke-width="1" opacity="0.3"/>
    <path d="M8,8 Q4,12 0,8 Q-4,4 -8,8" fill="none" stroke="#0A2E5A" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
