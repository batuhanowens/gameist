<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="transparent"/>
  
  <!-- Fire Element - Top Left Corner -->
  <g transform="translate(10, 10)">
    <path d="M12 3C12 3 6 9 6 15C6 21 9 24 12 24C15 24 18 21 18 15C18 9 12 3 12 3Z" 
          fill="#12487E" opacity="0.7"/>
    <path d="M12 8C12 8 10 10 10 12C10 14 11 15 12 15C13 15 14 14 14 12C14 10 12 8 12 8Z" 
          fill="#12487E" opacity="0.9"/>
    <circle cx="12" cy="11" r="1.5" fill="#12487E" opacity="0.6"/>
  </g>
  
  <!-- Water Element - Top Right Corner -->
  <g transform="translate(85, 10)">
    <path d="M12 3C12 3 6 9 6 15C6 21 9 24 12 24C15 24 18 21 18 15C18 9 12 3 12 3Z" 
          fill="#12487E" opacity="0.7"/>
    <circle cx="9" cy="9" r="2" fill="#12487E" opacity="0.8"/>
    <circle cx="15" cy="12" r="1.5" fill="#12487E" opacity="0.6"/>
    <path d="M10 15 Q12 13 14 15" fill="none" stroke="#12487E" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Earth Element - Bottom Left Corner -->
  <g transform="translate(10, 85)">
    <rect x="6" y="6" width="12" height="12" rx="3" fill="#12487E" opacity="0.7"/>
    <circle cx="12" cy="12" r="3" fill="#12487E" opacity="0.9"/>
    <rect x="10" y="10" width="4" height="4" rx="1" fill="#12487E" opacity="0.6"/>
  </g>
  
  <!-- Air Element - Bottom Right Corner -->
  <g transform="translate(85, 85)">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#12487E" stroke-width="2" opacity="0.7"/>
    <circle cx="12" cy="12" r="5" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.8"/>
    <circle cx="12" cy="12" r="2" fill="#12487E" opacity="0.9"/>
    <path d="M8 8 L16 16 M16 8 L8 16" stroke="#12487E" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Hero Character Silhouette - Center -->
  <g transform="translate(50, 50)">
    <!-- Head -->
    <ellipse cx="10" cy="6" rx="5" ry="4" fill="#12487E" opacity="0.5"/>
    <!-- Body -->
    <rect x="6" y="8" width="8" height="10" rx="2" fill="#12487E" opacity="0.6"/>
    <!-- Arms -->
    <rect x="3" y="10" width="3" height="6" rx="1" fill="#12487E" opacity="0.4"/>
    <rect x="14" y="10" width="3" height="6" rx="1" fill="#12487E" opacity="0.4"/>
    <!-- Legs -->
    <rect x="7" y="16" width="2.5" height="5" rx="1" fill="#12487E" opacity="0.4"/>
    <rect x="10.5" y="16" width="2.5" height="5" rx="1" fill="#12487E" opacity="0.4"/>
    <!-- Weapon/Staff -->
    <rect x="17" y="4" width="1" height="12" rx="0.5" fill="#12487E" opacity="0.7"/>
    <circle cx="17.5" cy="3" r="1.5" fill="#12487E" opacity="0.8"/>
  </g>
  
  <!-- Enemy/Boss Silhouette - Top Center -->
  <g transform="translate(45, 25)">
    <ellipse cx="15" cy="8" rx="6" ry="5" fill="#12487E" opacity="0.4"/>
    <rect x="11" y="11" width="8" height="8" rx="2" fill="#12487E" opacity="0.5"/>
    <!-- Tentacles -->
    <path d="M13 15 Q10 20 12 22" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.6"/>
    <path d="M17 15 Q20 20 18 22" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.6"/>
    <path d="M15 15 Q15 20 15 23" fill="none" stroke="#12487E" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Power Orbs - Scattered -->
  <g transform="translate(25, 45)">
    <circle cx="3" cy="3" r="2" fill="#12487E" opacity="0.6"/>
    <circle cx="3" cy="3" r="1" fill="#12487E" opacity="0.8"/>
  </g>
  
  <g transform="translate(85, 45)">
    <circle cx="3" cy="3" r="2" fill="#12487E" opacity="0.6"/>
    <circle cx="3" cy="3" r="1" fill="#12487E" opacity="0.8"/>
  </g>
  
  <g transform="translate(55, 85)">
    <circle cx="3" cy="3" r="2" fill="#12487E" opacity="0.6"/>
    <circle cx="3" cy="3" r="1" fill="#12487E" opacity="0.8"/>
  </g>
  
  <!-- Connecting Energy Lines -->
  <path d="M25 25 Q60 45 95 25" fill="none" stroke="#12487E" stroke-width="0.5" opacity="0.2"/>
  <path d="M25 95 Q60 75 95 95" fill="none" stroke="#12487E" stroke-width="0.5" opacity="0.2"/>
  <path d="M25 25 L25 95" fill="none" stroke="#12487E" stroke-width="0.3" opacity="0.15"/>
  <path d="M95 25 L95 95" fill="none" stroke="#12487E" stroke-width="0.3" opacity="0.15"/>
</svg>
