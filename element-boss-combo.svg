<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="150" height="150" fill="transparent"/>
  
  <!-- Boss Enemy - Large Tentacle Creature -->
  <g transform="translate(75, 40)">
    <!-- Body glow -->
    <ellipse cx="0" cy="0" rx="20" ry="16" fill="#0A2E5A" opacity="0.2"/>
    
    <!-- Main body -->
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="#0A2E5A" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#0A2E5A" opacity="0.5"/>
    
    <!-- Eye -->
    <circle cx="0" cy="-2" r="4" fill="#061A3A" opacity="0.8"/>
    <circle cx="0" cy="-2" r="2" fill="#0A2E5A" opacity="0.9"/>
    
    <!-- Tentacles -->
    <path d="M-8,8 Q-12,16 -10,22" fill="none" stroke="#0A2E5A" stroke-width="3" opacity="0.6"/>
    <path d="M0,10 Q0,18 2,24" fill="none" stroke="#0A2E5A" stroke-width="3" opacity="0.6"/>
    <path d="M8,8 Q12,16 10,22" fill="none" stroke="#0A2E5A" stroke-width="3" opacity="0.6"/>
    <path d="M-6,10 Q-8,14 -6,18" fill="none" stroke="#0A2E5A" stroke-width="2" opacity="0.5"/>
    <path d="M6,10 Q8,14 6,18" fill="none" stroke="#0A2E5A" stroke-width="2" opacity="0.5"/>
    
    <!-- Evil aura -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0A2E5A" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Combo Element - Fire + Water Fusion -->
  <g transform="translate(75, 110)">
    <!-- Base circle -->
    <circle cx="0" cy="0" r="18" fill="#0A2E5A" opacity="0.3"/>
    
    <!-- Fire half (left) -->
    <path d="M-18,0 A18,18 0 0,1 0,-18 L0,0 Z" fill="#0A2E5A" opacity="0.5"/>
    <path d="M-12,0 A12,12 0 0,1 0,-12 L0,0 Z" fill="#0A2E5A" opacity="0.6"/>
    
    <!-- Water half (right) -->
    <path d="M0,18 A18,18 0 0,1 0,0 L0,0 Z" fill="#0A2E5A" opacity="0.5"/>
    <path d="M0,12 A12,12 0 0,1 0,0 L0,0 Z" fill="#0A2E5A" opacity="0.6"/>
    
    <!-- Fusion core -->
    <circle cx="0" cy="0" r="5" fill="#0A2E5A" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#061A3A" opacity="0.9"/>
    
    <!-- Energy sparks -->
    <circle cx="-6" cy="-6" r="1.5" fill="#0A2E5A" opacity="0.6"/>
    <circle cx="6" cy="6" r="1.5" fill="#0A2E5A" opacity="0.6"/>
    <circle cx="0" cy="-8" r="1" fill="#0A2E5A" opacity="0.5"/>
    <circle cx="0" cy="8" r="1" fill="#0A2E5A" opacity="0.5"/>
  </g>
</svg>
